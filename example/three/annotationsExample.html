<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<meta charset="utf-8"/>

		<title>MVT Annotations on Google 3D Tiles</title>
		<link rel="stylesheet" href="../styles.css">
		<style>
			:root {
				--tooltip-background: #26252f;
				--tooltip-border: #3f3e4c;
			}

			#tooltip {
				position: fixed;
				pointer-events: none;
				display: none;
				padding: 6px 10px;
				border-radius: 6px;
				border: 1px solid var( --tooltip-border );
				background: var( --tooltip-background );
				box-shadow: 0 2px 12px rgba( 0, 0, 0, 0.45 );
				color: #fff;
				font-size: 13px;
				line-height: 1.35;
				white-space: nowrap;
			}

			#tooltip .kind {
				display: block;
				color: #aeacc4;
				font-size: 11px;
				text-transform: capitalize;
			}

			/* caret pointing down at the annotation, drawn twice so it keeps the panel's hairline edge */
			#tooltip::before,
			#tooltip::after {
				content: '';
				position: absolute;
				top: 100%;
				left: var( --caret-x, 50% );
				width: 0;
				height: 0;
				transform: translateX( -50% );
				border-left: 7px solid transparent;
				border-right: 7px solid transparent;
			}

			#tooltip::before {
				border-top: 8px solid var( --tooltip-border );
			}

			/* pulled up over the panel's bottom border so the caret and the box read as one shape */
			#tooltip::after {
				margin-top: -2px;
				border-top: 8px solid var( --tooltip-background );
			}
		</style>
    </head>
    <body>
		<div id="info">
			<div>
				MVT Annotations with <a href="https://cloud.google.com/blog/products/maps-platform/create-immersive-3d-map-experiences-photorealistic-3d-tiles">Google Photorealistic 3D Tiles</a>, <a href="https://ion.cesium.com/">Cesium Ion</a>, & <a href="https://source.coop/protomaps/openstreetmap">Source Coop</a>.
			</div>
		</div>

		<div id="tooltip"></div>

		<div id="footer">
			<div id="credits"></div>
			<div id="logos">
				<img src="../logos/google.png" />
				<img src="../logos/cesiumion.png" />
			</div>
		</div>
        <script type="module" src="./annotationsExample.js"></script>
    </body>
</html>
