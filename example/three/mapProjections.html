<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<meta charset="utf-8"/>

		<title>Map Projections</title>
		<link rel="stylesheet" href="../styles.css">
		<style>
			#coords {
				position: absolute;
				bottom: 0;
				left: 0;

			Demonstration of terrain and vector map data displayed on the ellipsoid and planar map projections.
			<br/>

		</div>
		<div id="coords"></div>
        <script src="./mapProjections.js" type="module"></script>
